name: 构建与发版

# 每次 push / PR 都在六个平台真打一遍包（产物流在 Actions 的 artifact 里），
# 打 tag 时再额外建一个 GitHub Release。
#
# 产物是 gpm 认的格式：ai-desk-<版本>-<os>-<arch>.zip，里面装着
# ad-manifest.yaml / payload/ / tools/<os>_<arch>/{cot,tdp} / SHA256SUMS /
# gpm 自己 / install.sh / install.cmd / GUI-Setup.app（随包的图形安装器）。
# 用户解压后跑 install.sh（或双击 install.cmd）就装好了，全程不需要联网；
# 也可以直接双击 GUI-Setup.app，由它在图形界面里问清选项再调 install.sh。
#
# gpm 与 GUI-Setup 都不从这里下载现成的 release，而是就地用源码编 —— 这样
# 几个仓库的改动能一起被验证，也不必先有它们的 release 才能跑这里的 CI。
# 契约在 gpm-go 的 docs/PACKAGE-FORMAT.md。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      gpm_ref:
        description: 内嵌的 gpm 用 gpm-go 的哪个 ref
        required: false
        default: v0.6.4
      gsetup_ref:
        description: 随包的 GUI-Setup 用 gsetup-go 的哪个 ref
        required: false
        default: v0.1.0

permissions:
  contents: write

env:
  # 打进包里的 gpm 取哪个版本。跟工具链一样钉死：分发包必须可复现，
  # 不能今天编出 v0.6.4、明天被 gpm-go 的 main 悄悄换掉。
  GPM_REF: ${{ github.event.inputs.gpm_ref || 'v0.6.4' }}
  # 随包的 GUI-Setup 同理：钉在 gsetup-go 的 tag 上。
  GSETUP_REF: ${{ github.event.inputs.gsetup_ref || 'v1.0.0' }}
  # 打进包里的 cot / tdp 从公开仓 qiuzhanghua/dl 取。那里的 tag 是滚动的
  # （cot / tdp），版本写在资产名里：cot_<版本>_<os>_<arch>。所以这里钉住的是
  # 资产名里那一段版本号，同一个 tag 下换版本不影响可复现性。
  DL_REPO: qiuzhanghua/dl
  COT_VERSION: 2.0.1
  TDP_VERSION: 27.0.6

jobs:
  build:
    name: 打包 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 六个平台，各用**原生** runner：Tauri 的打包链（Linux 的 webkit2gtk、
        # macOS 的 .app、Windows 的 MSVC）没法像纯 Go 那样在一个 runner 上交叉
        # 编出全部产物（对照 gpm-go：那边 CGO_ENABLED=0，一个 ubuntu-latest 编六个）。
        #
        # 标签都取自 GitHub 文档「公开仓的标准 runner」那张表 —— 公开仓的标准 runner
        # **免费且不限量**，所以六个都跑得起；唯一要留神的是 macOS 的并发上限
        # （免费档 5 个），这里占 2 个。
        #
        # 特别注意 macOS 的 Intel：是 `macos-26-intel`（标准 runner，4C/14GB），
        # 不是 `macos-26-large` / `macos-latest-large` —— 那种 -large/-xlarge 属于
        # larger runner，要 Team/Enterprise 计划加信用卡才能用。
        include:
          - name: macOS (arm64)
            os: macos-14
            triple: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            ext: ''
          - name: macOS (x64)
            os: macos-26-intel
            triple: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            ext: ''
          - name: Linux (amd64)
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            ext: ''
          - name: Linux (arm64)
            os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            ext: ''
          - name: Windows (amd64)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            ext: '.exe'
          - name: Windows (arm64)
            os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            goos: windows
            goarch: arm64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      # gpm 与 AI Desk 是两个仓库，这里把 gpm-go 检出到一个子目录，就地编。
      # fetch-depth: 0 是为了把 tag 也带下来 —— 下一步要用 git describe
      # 读出这份 gpm 源码的版本号（浅克隆里没有 tag，只能退化成短 SHA）。
      - uses: actions/checkout@v4
        with:
          repository: qiuzhanghua/gpm-go
          ref: ${{ env.GPM_REF }}
          path: .gpm-go
          fetch-depth: 0

      # 随包的图形安装器 GUI-Setup 在第三个仓库里（Wails v2 写的），同样就地编。
      - uses: actions/checkout@v4
        with:
          repository: qiuzhanghua/gsetup-go
          ref: ${{ env.GSETUP_REF }}
          path: .gsetup-go

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version-file: .gpm-go/go.mod
          cache-dependency-path: .gpm-go/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 按 target 分开缓存：同一个 OS 上的 amd64 与 arm64 是两个矩阵腿，
          # 缓存目录里的 target/<triple>/ 本来就不一样，分开更省事也更好看。
          key: ${{ matrix.triple }}

      # Tauri 在 Linux 上要的是一整套 webkit2gtk 头文件，不是可选项。
      - name: 装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 必须是 npm ci 而不是 npm install：Tauri 会检查 npm 包与 Rust crate 的
      # 版本是否同 major/minor，package.json 里写 "^2" 的话 CI 每次都可能
      # 装到最新的 2.x，而 Cargo.lock 里的 crate 还是旧的，于是构建在
      # 版本不匹配上直接失败。package-lock.json 已经把两边钉在一起了。
      - name: npm ci
        run: npm ci

      - name: 从源码编出 gpm
        shell: bash
        working-directory: .gpm-go
        env:
          CGO_ENABLED: '0'
        run: |
          echo "gpm 来自 $(git rev-parse --short HEAD)（$GPM_REF）"
          # 内嵌的 gpm 得能自报家门：GPM_REF 钉在 tag 上时 describe 就是那个
          # 版本；万一有人改成 main，它会退化成 "0.5.0-3-g1a2b3c4" 这种，
          # 至少还能看出包里的 gpm 是哪段源码编的，不会又变成 0.1.0-dev。
          gpm_version=$(git describe --tags --always)
          gpm_version=${gpm_version#v}
          echo "这份 gpm 自报版本 $gpm_version"
          go build -trimpath -ldflags "-s -w -X main.version=$gpm_version" \
            -o "$GITHUB_WORKSPACE/gpm-bin${{ matrix.ext }}" ./cmd/gpm

      # 随包的图形安装器（GUI-Setup）：Wails v2 = Go + 系统 webview，六个平台各
      # 自原生编一份（CGO，没法像 gpm 那样一个 runner 编六个）。frontend/dist
      # 与 wailsjs 都在仓库里、wails.json 的 frontend:build 留空，所以这里不
      # 需要 npm，只要 wails CLI 与系统 webkit 头文件（Linux 上已经装过）。
      - name: 编出 GUI-Setup
        shell: bash
        working-directory: .gsetup-go
        run: |
          echo "GUI-Setup 来自 $(git rev-parse --short HEAD)（$GSETUP_REF）"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          wails_bin="$(go env GOPATH)/bin/wails"
          # Ubuntu 24.04 起只有 webkit2gtk-4.1 了，Wails v2 要靠这个 tag 才会
          # 去找它（4.0 那一支在新镜像上已经不存在）。
          tags=""
          if [ "${{ runner.os }}" = "Linux" ]; then tags="-tags webkit2_41"; fi
          "$wails_bin" build -clean $tags
          ls -l build/bin

      # 要嵌进包里的两家工具链：cot 与 tdp。取的是 dl 上的正式产物，不在这里
      # 编 —— 省几分钟，而且装进包的必须是用户自己也会下载到的那个二进制。
      # dl 是公开仓，默认的 GITHUB_TOKEN 就能读；以前走私有仓 cot_cli 的那个
      # secrets.COT_CLI_TOKEN 不再需要了。
      - name: 取 cot 与 tdp 二进制
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ matrix.goos }}" in
            darwin)
              cot_asset="cot_${COT_VERSION}_darwin_${{ matrix.goarch }}"
              tdp_asset="tdp_${TDP_VERSION}_darwin_${{ matrix.goarch }}"
              ;;
            linux)
              # dl 里 Linux 按 libc 分家，Tauri 的 Linux 产物走 gnu 那一支；
              # tdp 目前只有一支，名字里不带 libc。
              cot_asset="cot_${COT_VERSION}_linux_${{ matrix.goarch }}_gnu"
              tdp_asset="tdp_${TDP_VERSION}_linux_${{ matrix.goarch }}"
              ;;
            windows)
              cot_asset="cot_${COT_VERSION}_windows_${{ matrix.goarch }}.exe"
              tdp_asset="tdp_${TDP_VERSION}_windows_${{ matrix.goarch }}.exe"
              ;;
            *)
              echo "认不出的平台：${{ matrix.goos }}" >&2
              exit 1
              ;;
          esac
          mkdir -p tc-asset && cd tc-asset
          # dl 里放的是裸二进制（不是 tar.gz / zip），下下来就是可执行文件本身。
          gh release download cot -R "$DL_REPO" -p "$cot_asset"
          gh release download tdp -R "$DL_REPO" -p "$tdp_asset"
          ls -l
          for pair in "cot=$cot_asset" "tdp=$tdp_asset"; do
            name=${pair%%=*}
            asset=${pair#*=}
            if [ ! -f "$asset" ]; then
              echo "dl 里没有 $asset" >&2
              find . -type f >&2
              exit 1
            fi
            dest="$GITHUB_WORKSPACE/$name-bin${{ matrix.ext }}"
            cp "$asset" "$dest"
            chmod +x "$dest" 2>/dev/null || true
          done
          # 自报家门：包里这两份必须真能跑，版本就是上面钉的那个。
          "$GITHUB_WORKSPACE/cot-bin${{ matrix.ext }}" --version
          "$GITHUB_WORKSPACE/tdp-bin${{ matrix.ext }}" version

      # 版本号从 tauri.conf.json 里读，脚本那边就不用再依赖 python 了。
      - name: 算版本号
        id: ver
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # macOS 要 .app；另外两个平台只要裸可执行文件，所以 --no-bundle 就够，
      # 顺带省掉 linuxdeploy 与 WiX 那一堆打包器依赖。
      #
      # v0.2.1 起摘掉了 Tauri updater（见 README 的「更新方式」），所以既不需要
      # 更新包签名私钥，也不再产出 `.app.tar.gz` / `.sig`。
      - name: tauri build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            npx tauri build --target ${{ matrix.triple }} --bundles app
          else
            npx tauri build --target ${{ matrix.triple }} --no-bundle
          fi

      - name: 打成 gpm 分发包
        shell: bash
        run: |
          case "${{ matrix.goos }}" in
            darwin)  setup="$GITHUB_WORKSPACE/.gsetup-go/build/bin/GUI-Setup.app" ;;
            windows) setup="$GITHUB_WORKSPACE/.gsetup-go/build/bin/GUI-Setup.exe" ;;
            linux)   setup="$GITHUB_WORKSPACE/.gsetup-go/build/bin/GUI-Setup" ;;
          esac
          bash tools/package.sh \
            -c "gpm-bin${{ matrix.ext }}" \
            -x "cot=$GITHUB_WORKSPACE/cot-bin${{ matrix.ext }}" \
            -x "tdp=$GITHUB_WORKSPACE/tdp-bin${{ matrix.ext }}" \
            -t "${{ matrix.triple }}" \
            -v "${{ steps.ver.outputs.version }}" \
            -n "AI Desk" \
            -s "$setup"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-desk-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: 发 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建 Release 并传产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
