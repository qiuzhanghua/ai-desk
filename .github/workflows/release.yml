name: 构建与发版

# 每次 push / PR 都在三个平台真打一遍包（产物流在 Actions 的 artifact 里），
# 打 tag 时再额外建一个 GitHub Release。
#
# 产物是 gpm 认的格式：ai-desk-<版本>-<os>-<arch>.zip，里面装着
# ad-manifest.yaml / payload/ / tools/<os>_<arch>/cot / SHA256SUMS /
# gpm 自己 / install.sh / install.cmd。用户解压后跑 install.sh
# （或双击 install.cmd）就装好了，全程不需要联网。
#
# gpm 不从这里下载现成的 release，而是就地用源码编一个 —— 这样两个仓库的
# 改动能一起被验证，也不必先有 gpm 的 release 才能跑这里的 CI。
# 契约在 gpm-go 的 docs/PACKAGE-FORMAT.md。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      gpm_ref:
        description: 内嵌的 gpm 用 gpm-go 的哪个 ref
        required: false
        default: v0.6.0

permissions:
  contents: write

env:
  # 打进包里的 gpm 取哪个版本。跟 COT_REF 一样钉死：分发包必须可复现，
  # 不能今天编出 v0.6.0、明天被 gpm-go 的 main 悄悄换掉。
  GPM_REF: ${{ github.event.inputs.gpm_ref || 'v0.6.0' }}
  # 打进包里的 cot 取哪个版本。钉住，不用 latest —— 分发包必须可复现。
  COT_REF: v2.0.1

jobs:
  build:
    name: 打包 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-14
            triple: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            ext: ''
            cot_ext: tar.gz
          - name: Linux (amd64)
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            ext: ''
            cot_ext: tar.gz
          - name: Windows (amd64)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            ext: '.exe'
            cot_ext: zip
    steps:
      - uses: actions/checkout@v4

      # gpm 与 AI Desk 是两个仓库，这里把 gpm-go 检出到一个子目录，就地编。
      # fetch-depth: 0 是为了把 tag 也带下来 —— 下一步要用 git describe
      # 读出这份 gpm 源码的版本号（浅克隆里没有 tag，只能退化成短 SHA）。
      - uses: actions/checkout@v4
        with:
          repository: qiuzhanghua/gpm-go
          ref: ${{ env.GPM_REF }}
          path: .gpm-go
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version-file: .gpm-go/go.mod
          cache-dependency-path: .gpm-go/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 在 Linux 上要的是一整套 webkit2gtk 头文件，不是可选项。
      - name: 装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 必须是 npm ci 而不是 npm install：Tauri 会检查 npm 包与 Rust crate 的
      # 版本是否同 major/minor，package.json 里写 "^2" 的话 CI 每次都可能
      # 装到最新的 2.x，而 Cargo.lock 里的 crate 还是旧的，于是构建在
      # 版本不匹配上直接失败。package-lock.json 已经把两边钉在一起了。
      - name: npm ci
        run: npm ci

      - name: 从源码编出 gpm
        shell: bash
        working-directory: .gpm-go
        env:
          CGO_ENABLED: '0'
        run: |
          echo "gpm 来自 $(git rev-parse --short HEAD)（$GPM_REF）"
          # 内嵌的 gpm 得能自报家门：GPM_REF 钉在 tag 上时 describe 就是那个
          # 版本；万一有人改成 main，它会退化成 "0.5.0-3-g1a2b3c4" 这种，
          # 至少还能看出包里的 gpm 是哪段源码编的，不会又变成 0.1.0-dev。
          gpm_version=$(git describe --tags --always)
          gpm_version=${gpm_version#v}
          echo "这份 gpm 自报版本 $gpm_version"
          go build -trimpath -ldflags "-s -w -X main.version=$gpm_version" \
            -o "$GITHUB_WORKSPACE/gpm-bin${{ matrix.ext }}" ./cmd/gpm

      # 要嵌进包里的 cot。cot_cli 是私有仓，所以这条要用一个能读它的
      # token（secrets.COT_CLI_TOKEN）：公开仓的 GITHUB_TOKEN 拿不到别人的
      # 私有 release 资产。取的是该版本的正式产物，不在这里编 cot ——
      # 省几分钟，而且装进包的必须是用户真正会拿到的那个二进制。
      - name: 取 cot 二进制
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COT_CLI_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "缺少 secrets.COT_CLI_TOKEN —— 它是读私有仓 qiuzhanghua/cot_cli 的 release 资产用的" >&2
            exit 1
          fi
          mkdir -p cot-asset && cd cot-asset
          gh release download "$COT_REF" -R qiuzhanghua/cot_cli \
            -p "cot-$COT_REF-${{ matrix.triple }}.${{ matrix.cot_ext }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Expand-Archive -Path (Get-ChildItem *.zip).FullName -DestinationPath . -Force"
          else
            tar xzf ./*.tar.gz
          fi
          bin=$(find . -type f -name "cot${{ matrix.ext }}" | head -1)
          if [ -z "$bin" ]; then
            echo "资产里没有 cot${{ matrix.ext }}" >&2
            find . -type f >&2
            exit 1
          fi
          cp "$bin" "$GITHUB_WORKSPACE/cot-bin${{ matrix.ext }}"
          chmod +x "$GITHUB_WORKSPACE/cot-bin${{ matrix.ext }}" 2>/dev/null || true
          "$GITHUB_WORKSPACE/cot-bin${{ matrix.ext }}" --version

      # 版本号从 tauri.conf.json 里读，脚本那边就不用再依赖 python 了。
      - name: 算版本号
        id: ver
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # macOS 要 .app；另外两个平台只要裸可执行文件，所以 --no-bundle 就够，
      # 顺带省掉 linuxdeploy 与 WiX 那一堆打包器依赖。
      #
      # 更新包签名：tauri.conf.json 里已经填了公钥，一旦开了
      # createUpdaterArtifacts 而环境里没有私钥，tauri build 会直接报
      # “A public key has been found, but no private key” 而失败。
      # 所以这里按密钥在不在来决定开不开——没配密钥时 CI 照旧出分发包，
      # 只是不产 `.app.tar.gz` / `.sig`。
      - name: tauri build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "已配置签名私钥，本次产出更新包"
            cfg='{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "未配置 TAURI_SIGNING_PRIVATE_KEY，本次不产出更新包"
            cfg='{"bundle":{"createUpdaterArtifacts":false}}'
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            npx tauri build --config "$cfg" --target ${{ matrix.triple }} --bundles app
          else
            npx tauri build --config "$cfg" --target ${{ matrix.triple }} --no-bundle
          fi

      - name: 打成 gpm 分发包
        shell: bash
        run: |
          bash tools/package.sh \
            -c "gpm-bin${{ matrix.ext }}" \
            -x "cot=$GITHUB_WORKSPACE/cot-bin${{ matrix.ext }}" \
            -t "${{ matrix.triple }}" \
            -v "${{ steps.ver.outputs.version }}" \
            -n "AI Desk"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-desk-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: 发 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建 Release 并传产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
