name: 构建与发版

# 每次 push / PR 都在三个平台真打一遍包（产物流在 Actions 的 artifact 里），
# 打 tag 时再额外建一个 GitHub Release。
#
# 产物是 cpi 认的格式：ai-desk-<版本>-<os>-<arch>.zip，里面装着
# manifest.yaml / payload/ / SHA256SUMS / cpi 自己 / install.sh / install.cmd。
# 用户解压后跑 install.sh（或双击 install.cmd）就装好了。
#
# cpi 不从这里下载现成的 release，而是就地用源码编一个 —— 这样两个仓库的
# 改动能一起被验证，也不必先有 cpi 的 release 才能跑这里的 CI。
# 契约在 cpi-go 的 docs/PACKAGE-FORMAT.md。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      cpi_ref:
        description: 内嵌的 cpi 用 cpi-go 的哪个 ref
        required: false
        default: main

permissions:
  contents: write

env:
  CPI_REF: ${{ github.event.inputs.cpi_ref || 'main' }}

jobs:
  build:
    name: 打包 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-14
            triple: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            ext: ''
          - name: Linux (amd64)
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            ext: ''
          - name: Windows (amd64)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      # cpi 与 AI Desk 是两个仓库，这里把 cpi-go 检出到一个子目录，就地编。
      - uses: actions/checkout@v4
        with:
          repository: qiuzhanghua/cpi-go
          ref: ${{ env.CPI_REF }}
          path: .cpi-go

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version-file: .cpi-go/go.mod
          cache-dependency-path: .cpi-go/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 在 Linux 上要的是一整套 webkit2gtk 头文件，不是可选项。
      - name: 装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: npm install
        run: npm install

      - name: 从源码编出 cpi
        shell: bash
        working-directory: .cpi-go
        env:
          CGO_ENABLED: '0'
        run: |
          echo "cpi 来自 $(git rev-parse --short HEAD)（$CPI_REF）"
          go build -trimpath -o "$GITHUB_WORKSPACE/cpi-bin${{ matrix.ext }}" ./cmd/cpi

      # 版本号从 tauri.conf.json 里读，脚本那边就不用再依赖 python 了。
      - name: 算版本号
        id: ver
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # macOS 要 .app；另外两个平台只要裸可执行文件，所以 --no-bundle 就够，
      # 顺带省掉 linuxdeploy 与 WiX 那一堆打包器依赖。
      - name: tauri build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            npx tauri build --target ${{ matrix.triple }} --bundles app
          else
            npx tauri build --target ${{ matrix.triple }} --no-bundle
          fi

      - name: 打成 cpi 分发包
        shell: bash
        run: |
          bash tools/package.sh \
            -c "cpi-bin${{ matrix.ext }}" \
            -t "${{ matrix.triple }}" \
            -v "${{ steps.ver.outputs.version }}" \
            -n "AI Desk"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-desk-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: 发 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建 Release 并传产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
